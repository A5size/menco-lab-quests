name: validate-quest
on:
  issues:
    types: [opened, edited]

# カタログ更新の競合を防ぐため直列実行
# 収載のコミットは競合しても取り直すので、実行そのものは並べてよい。
# Issue ごとに分ければ、同じIssueの連続編集だけが直列になる
concurrency:
  group: quest-validation-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  validate:
    if: contains(github.event.issue.labels.*.name, 'submission') || startsWith(github.event.issue.title, '[依頼書]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 依頼書コードを抽出
        id: extract
        env:
          BODY: ${{ github.event.issue.body }}
        run: |
          set -e
          CODE=$(printf '%s' "$BODY" | grep -oE 'MENCOQ1[A-Za-z0-9+/=.\-]+' | head -1 || true)
          if [ -z "$CODE" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "found=true" >> "$GITHUB_OUTPUT"
            printf '%s\n' "$CODE" > /tmp/code.txt
          fi

      - name: コードなし → 案内して終了
        if: steps.extract.outputs.found == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment ${{ github.event.issue.number }} --repo ${{ github.repository }} \
            --body "依頼書コード(MENCOQ1…)が見つかりませんでした。本文にコードをそのまま貼り付けて、Issueを編集してください。"

      - name: 検証機を取得(Releases)
        if: steps.extract.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh release download validator --repo ${{ github.repository }} --pattern 'menco-validator-linux.tar.gz' --dir /tmp
          mkdir -p /tmp/validator && tar xzf /tmp/menco-validator-linux.tar.gz -C /tmp/validator
          chmod +x /tmp/validator/MencoLab.x86_64

      - name: 実行時ライブラリの準備
        if: steps.extract.outputs.found == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libasound2t64 libglu1-mesa libxcursor1 libxrandr2 libxinerama1 libxi6 || \
            sudo apt-get install -y -qq xvfb libasound2 libglu1-mesa libxcursor1 libxrandr2 libxinerama1 libxi6 || true

      - name: 検証を実行
        if: steps.extract.outputs.found == 'true'
        id: verify
        run: |
          set +e
          xvfb-run -a /tmp/validator/MencoLab.x86_64 -batchmode -nographics \
            -menco-verifycode -in /tmp/code.txt -out /tmp/result.txt -logFile /tmp/player.log
          rc=$?
          echo "--- player.log (tail) ---"
          tail -60 /tmp/player.log 2>/dev/null || echo "(no player.log)"
          [ -f /tmp/result.txt ] || { echo "検証機が異常終了(結果なし, rc=$rc)" > /tmp/result.txt; rc=2; }
          echo "exit=$rc" >> "$GITHUB_OUTPUT"
          echo "result<<EOF" >> "$GITHUB_OUTPUT"
          cat /tmp/result.txt >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: 合格 → カタログ収載してクローズ
        if: steps.extract.outputs.found == 'true' && steps.verify.outputs.exit == '0'
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ steps.verify.outputs.result }}
        run: |
          set -e
          OKLINE=$(printf '%s' "$RESULT" | grep '^OK ' | head -1)
          QUID=$(printf '%s' "$OKLINE" | sed -n 's/^OK uid=\([0-9a-f]*\) .*/\1/p')
          PLAYER=$(printf '%s' "$OKLINE" | sed -n 's/^OK uid=[0-9a-f]* player=\([0-9a-f]*\) .*/\1/p')
          CREATED=$(printf '%s' "$OKLINE" | sed -n 's/^OK uid=[0-9a-f]* player=[0-9a-f]* created=\([0-9]*\) .*/\1/p')
          TITLE=$(printf '%s' "$OKLINE" | sed -n 's/^OK uid=[0-9a-f]* player=[0-9a-f]* created=[0-9]* title=//p')
          CODE=$(cat /tmp/code.txt)
          git config user.name "quest-bot"
          git config user.email "actions@github.com"
          # 同じ瞬間に複数の検証が走ると quests.json の同じ箇所を触って
          # rebase が自動解決できず落ちる(2026-08-19に15件が待ちのまま残った)。
          # 「最新を取り直してから追記して push」を、押せるまで繰り返す。
          # これならリベースの衝突自体が起きない
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p catalog
            [ -f catalog/quests.json ] || echo '{"items":[]}' > catalog/quests.json
            # 主キーは恒久ID。同じ課題の投稿は最新の内容で置き換える
            jq --arg u "$QUID" --arg t "$TITLE" --arg c "$CODE" \
               --arg a "${{ github.event.issue.user.login }}" \
               --arg p "$PLAYER" --argjson cr "${CREATED:-0}" \
               --argjson n ${{ github.event.issue.number }} \
               '.items = ((.items // []) | map(select(.uid != $u)))
                  + [{uid:$u, title:$t, code:$c, author:$a, player:$p, created:$cr, issue:$n}]' \
               catalog/quests.json > /tmp/q.json && mv /tmp/q.json catalog/quests.json
            git add catalog/quests.json
            git commit -m "収載: ${TITLE} [${QUID}] (#${{ github.event.issue.number }})" || true
            if git push origin HEAD:main; then
              echo "収載しました(試行 $attempt)"
              break
            fi
            echo "他の実行と競合したので取り直します(試行 $attempt)"
            sleep $((RANDOM % 10 + 5))
            if [ "$attempt" = "8" ]; then echo "::error::カタログへ push できませんでした"; exit 1; fi
          done
          gh issue edit ${{ github.event.issue.number }} --repo ${{ github.repository }} --add-label accepted || true
          gh issue comment ${{ github.event.issue.number }} --repo ${{ github.repository }} \
            --body "検証合格。「${TITLE}」をカタログに収載しました。ありがとうございます!"
          gh issue close ${{ github.event.issue.number }} --repo ${{ github.repository }} --reason completed

      - name: 不合格 → 理由をコメントしてクローズ
        if: steps.extract.outputs.found == 'true' && steps.verify.outputs.exit != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ steps.verify.outputs.result }}
        run: |
          gh issue edit ${{ github.event.issue.number }} --repo ${{ github.repository }} --add-label rejected || true
          gh issue comment ${{ github.event.issue.number }} --repo ${{ github.repository }} \
            --body "検証に不合格でした。$(printf '\n\n```\n%s\n```\n' "$RESULT")コードが正しいか、ゲーム内で発行されたものをそのまま貼ったかをご確認ください。"
          gh issue close ${{ github.event.issue.number }} --repo ${{ github.repository }} --reason "not planned"
