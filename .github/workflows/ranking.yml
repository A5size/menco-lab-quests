name: ranking
on:
  issue_comment:
    types: [created]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

concurrency:
  group: ranking
  cancel-in-progress: false

permissions:
  contents: write
  issues: read

jobs:
  aggregate:
    # playlog(#2)へのコメント時と定期実行
    if: github.event_name != 'issue_comment' || github.event.issue.number == 2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 集計
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh api "repos/${{ github.repository }}/issues/2/comments?per_page=100" --paginate \
            -q '.[].body' > /tmp/plays.txt || true
          python3 - <<'PY'
          import json, re, collections, os
          # 課題ごとの作者(恒久ID)。自作自演でランキングを操作されないよう、作者本人の挑戦は数えない
          author = {}
          if os.path.exists('catalog/quests.json'):
              for q in json.load(open('catalog/quests.json')).get('items', []):
                  author[q.get('issue')] = q.get('player') or ''
          plays = collections.defaultdict(list)
          pat = re.compile(r'play issue=(\d+) win=([01]) time=([\d.]+) title=(.*) player=(\S+)$')
          for line in open('/tmp/plays.txt'):
              m = pat.match(line.strip())
              if not m: continue
              issue, win, t, title, player = int(m[1]), m[2]=='1', float(m[3]), m[4], m[5]
              plays[issue].append({'win': win, 'time': t, 'title': title, 'player': player})
          MIN_PLAYS = 5     # 勝率を出すのに必要な挑戦数(少数の偶然で上位に来ないように)
          out = {'quests': []}
          for issue, allps in sorted(plays.items()):
              ps = [p for p in allps if p['player'] != author.get(issue, '')]
              wins = [p for p in ps if p['win']]
              best = {}
              for p in wins:
                  if p['player'] not in best or p['time'] < best[p['player']]['time']:
                      best[p['player']] = p
              board = sorted(best.values(), key=lambda p: p['time'])[:20]
              out['quests'].append({
                  'issue': issue,
                  'title': allps[-1]['title'],
                  'plays': len(ps),
                  'clears': len(wins),
                  'winRate': (len(wins) / len(ps)) if len(ps) >= MIN_PLAYS else -1,
                  'board': [{'player': p['player'], 'time': p['time']} for p in board],
              })
          json.dump(out, open('/tmp/ranking.json','w'), ensure_ascii=False, indent=1)

          # GitHub上で読めるランキング表も出す(難関順=勝率が低いほど上位、挑戦5回未満は末尾)
          import datetime
          quests = {}
          if os.path.exists('catalog/quests.json'):
              for q in json.load(open('catalog/quests.json')).get('items', []):
                  quests[q.get('issue')] = q
          rows = []
          for q in out['quests']:
              info = quests.get(q['issue'], {})
              rows.append({
                  'title': info.get('title') or q['title'],
                  'uid': (info.get('uid') or '')[:8],
                  'author': info.get('author', '?'),
                  'created': info.get('created', 0),
                  'plays': q['plays'], 'clears': q['clears'], 'winRate': q['winRate'],
                  'issue': q['issue'],
              })
          # まだ誰も挑んでいない課題も載せる
          for issue, info in quests.items():
              if not any(r['issue'] == issue for r in rows):
                  rows.append({'title': info.get('title',''), 'uid': (info.get('uid') or '')[:8],
                               'author': info.get('author','?'), 'created': info.get('created',0),
                               'plays': 0, 'clears': 0, 'winRate': -1, 'issue': issue})
          rows.sort(key=lambda r: (r['winRate'] < 0, r['winRate'], -r['created']))
          def date(ts):
              return datetime.datetime.utcfromtimestamp(ts).strftime('%Y-%m-%d') if ts else '-'
          md = ['# 課題ランキング', '',
                '勝率が低い課題ほど上位(難関順)。作者本人の挑戦は数えません。挑戦5回未満は勝率を出さず末尾に置きます。', '',
                '| # | 課題 | 作者 | 登録日 | 挑戦 | クリア | 勝率 |', '|---:|---|---|---|---:|---:|---:|']
          for i, r in enumerate(rows, 1):
              rate = f"{r['winRate']*100:.0f}%" if r['winRate'] >= 0 else '—'
              md.append(f"| {i} | [{r['title']}](../../issues/{r['issue']}) `{r['uid']}` | {r['author']} | {date(r['created'])} | {r['plays']} | {r['clears']} | {rate} |")
          md += ['', f"更新: {datetime.datetime.utcnow().strftime('%Y-%m-%d %H:%M')} UTC"]
          open('/tmp/RANKING.md','w').write('\n'.join(md) + '\n')
          PY
          mkdir -p catalog
          cp /tmp/ranking.json catalog/ranking.json
          cp /tmp/RANKING.md RANKING.md
          if ! git diff --quiet catalog/ranking.json RANKING.md 2>/dev/null; then
            git config user.name "quest-bot"
            git config user.email "actions@github.com"
            git add catalog/ranking.json RANKING.md
            git commit -m "ランキング更新"
            git pull --rebase origin main
            git push origin main
          fi
