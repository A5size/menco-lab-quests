name: 依頼書の投稿
description: MENCO-LABで発行された依頼書コードを投稿します。検証に合格するとカタログに収載されます。
title: "[依頼書] "
labels: ["submission"]
body:
  - type: markdown
    attributes:
      value: |
        ゲーム内の依頼書エディタで「テスト挑戦」に勝利すると発行されるコード(MENCOQ1…)を貼り付けてください。
        投稿されたコードは自動検証(復号→静置チェック→クリア証明の再シミュレーション)にかけられ、
        合格すると自動でカタログに収載されます。結果はこのIssueにコメントされます。
  - type: textarea
    id: code
    attributes:
      label: 依頼書コード
      description: MENCOQ1 で始まるコードをそのまま貼り付け(前後の空白は無視されます)
      placeholder: MENCOQ1.....
    validations:
      required: true
  - type: textarea
    id: comment
    attributes:
      label: ひとこと(任意)
      description: 課題の紹介など。カタログには収載されません。
    validations:
      required: false
